<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Haven & Home</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .contact-box {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 18px 36px rgba(0,0,0,.06);
      padding: 28px;
      max-width: 700px;
      margin: 0 auto;
    }
    .contact-box input, .contact-box textarea {
      width: 100%;
      padding: 14px 12px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
    }
    .contact-box textarea { min-height: 140px; resize: vertical; }
    .contact-box .btn { width: 100%; text-align: center; border: none; }
  </style>
</head>
<body>
  <nav>
    <div class="nav">
      <div class="logo">Haven & Home</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="buy.html">Buy</a>
        <a href="rent.html">Rent</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
        <a class="nav-btn" href="contact.html">Book a Tour</a>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="wrap">
      <h1>Contact Us</h1>
      <p>Let us help you find the right property or schedule a personal consultation.</p>
    </div>
  </header>

  <main class="wrap">
    <section>
      <div class="contact-box">
        <input type="text" placeholder="Your Name" />
        <input type="email" placeholder="Email Address" />
        <input type="text" placeholder="Phone Number" />
        <textarea placeholder="Tell us what you are looking for..."></textarea>
        <a class="btn dark" href="mailto:hello@havenandhome.com">Send Message</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap foot">
      <div class="logo">Haven & Home</div>
      <div class="foot-links">
        <a href="buy.html">Buy</a>
        <a href="rent.html">Rent</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
      </div>
      <div>© 2026 Haven & Home</div>
    </div>
  </footer>
</body>
</html>
